<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judy.ai - Authenticating</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0f0f1e;
            color: #f0f0f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            text-align: center;
        }
        .auth-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
        }
        .auth-brand {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .auth-brand .dot {
            background: linear-gradient(135deg, #4FC3F7, #7C4DFF, #E040FB, #4DD0E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-text {
            font-size: 0.9rem;
            color: #8e8ea8;
            margin-bottom: 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(124, 77, 255, 0.2);
            border-top-color: #7C4DFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>
    <div class="auth-container">
        <svg class="auth-logo" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="ag1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4FC3F7"/>
                    <stop offset="30%" stop-color="#42A5F5"/>
                    <stop offset="60%" stop-color="#AB47BC"/>
                    <stop offset="100%" stop-color="#4DD0E1"/>
                </linearGradient>
                <linearGradient id="ag2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4FC3F7"/>
                    <stop offset="40%" stop-color="#7C4DFF"/>
                    <stop offset="70%" stop-color="#E040FB"/>
                    <stop offset="100%" stop-color="#4DD0E1"/>
                </linearGradient>
            </defs>
            <polygon points="72,12 95,25 95,55 72,68 49,55 49,25" fill="none" stroke="url(#ag1)" stroke-width="8" stroke-linejoin="round"/>
            <polygon points="50,22 78,38 78,72 50,88 22,72 22,38" fill="none" stroke="url(#ag2)" stroke-width="8" stroke-linejoin="round"/>
        </svg>
        <div class="auth-brand">Judy<span class="dot">.ai</span></div>
        <p class="auth-text">Authenticating, please wait...</p>
        <div class="spinner"></div>
    </div>
    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const idToken = params.get("id_token");
        if (idToken) {
            sessionStorage.setItem("id_token", idToken);
        }
        window.location.href = "/index.html";
    </script>
</body>
</html>
